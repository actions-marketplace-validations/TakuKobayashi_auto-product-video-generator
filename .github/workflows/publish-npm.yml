name: Publish CLI to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run test CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish CLI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: pnpm version:set "$RELEASE_VERSION"

      - name: Verify tag and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node .github/automation/verify-release-tag.mjs

      - name: Build
        run: pnpm build

      - name: Verify npm authentication
        run: node .github/automation/verify-npm-auth.mjs

      - name: Check whether this version is already published
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME=$(node --print "require('./packages/cli/package.json').name")
          PACKAGE_VERSION=$(node --print "require('./packages/cli/package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish CLI
        if: steps.npm-version.outputs.already-published != 'true'
        working-directory: packages/cli
        run: npm publish --registry https://registry.npmjs.org --access public --tag "$NPM_DIST_TAG" --loglevel verbose
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}

      - name: Collect npm publish diagnostics
        if: failure()
        run: node .github/automation/collect-npm-publish-diagnostics.mjs

      - name: Upload npm publish diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-publish-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/npm-publish-diagnostics/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create AI-generated release notes
        id: release-notes
        uses: TakuKobayashi/auto-generate-release-note@v2
        with:
          tag: ${{ github.ref_name }}
          model: qwen2.5-coder:7b-instruct
          language: ja
          bilingual: 'true'
