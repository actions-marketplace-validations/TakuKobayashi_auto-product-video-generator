project:
  name: auto-product-video-generator
  description: ""
source:
  localPath: ./
  installDeps: false
  # environmentFile: /path/to/project.env
  platformPriority:
    - web
    - cli
    - android
    - flutter
    - react-native
    - unity
    - ios
    - desktop
    - other
  exclude: []
video:
  type: demo
  resolution: 1920x1080
  fps: 30
  language: ja
  subtitles: true # false to render without subtitles
  singleLineSubtitles: true
  pageReadyWaitSeconds: 2
  sceneGapSeconds: 1
llm:
  provider: ollama
  model: qwen2.5:7b-instruct
  ollamaHost: http://127.0.0.1:11434
voice:
  # Every string in this YAML supports ${ANY_ENV_KEY}. A .env beside this file
  # is loaded automatically. Set envFile to use another file as well.
  # envFile: ./.env.local
  profiles:
    - name: narrator-1
      type: voicevox
      url: http://localhost:50021
      speakerId: 1
    - name: narrator-2
      type: voicevox
      url: http://localhost:50021
      speakerId: 2
    # AITalk 5 WebAPI can be mixed with VOICEVOX. Credentials are read from
    # AITALK_USERNAME and AITALK_PASSWORD by default.
    # - name: narrator-aitalk
    #   type: aitalk
    #   url: https://webapi.aitalk.jp/webapi/v5/ttsget.php
    #   speakerName: nozomi
    #   username: ${AITALK_USERNAME}
    #   password: ${AITALK_PASSWORD}
    #   AITalk ttsget options:
    #   https://www.ai-j.jp/manual/business/webapi/5/modules/Api/TTSGet.html
    #   options:
    #     use_udic: true
    #     ext: wav
    #     fs: 48000
    #     bit: 16
    #     channels: 1
    #     mvolume: 1.0
    #     volume: 1.0
    #     speed: 1.0
    #     pitch: 1.0
    #     range: 1.0
    #     style:
    #       j: 0.5 # joy
    #       s: 0.15 # sadness
    #       a: 0.35 # anger
    #     spause: 150
    #     lpause: 370
    #     epause: 800
    #     tpause: 0
output:
  dir: ./output
  workDir: ./.apvg
